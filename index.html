<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المكتبة الرقمية للتقنية الكهربائية</title>
<meta name="description" content="المكتبة الرقمية لقسم التقنية الكهربائية: كتب المقررات تفاعلية بشرح مطابق للمذكرات ومحاكاة حية.">
<meta name="theme-color" content="#123A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مكتبة الكهرباء">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="shared/icons/icon-192.png">
<link rel="apple-touch-icon" href="shared/icons/apple-touch-icon.png">
<link rel="stylesheet" href="shared/fonts.css">
<link rel="stylesheet" href="shared/book.css">
<style>
.lib-head{padding-block:30px 22px;border-bottom:1px solid var(--line)}
.lib-head .eyebrow{color:var(--blue-ink);font-weight:600}
.lib-head h1{font-size:clamp(28px,4.4vw,46px);font-weight:700;line-height:1.25;margin-top:6px}
.lib-head p{color:var(--muted);font-size:17px;max-width:64ch;margin-top:8px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:22px}
.book{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--fg);transition:box-shadow .15s,transform .15s}
.book:hover{box-shadow:0 10px 28px rgba(18,58,43,.12);transform:translateY(-2px)}
.book:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.cover2{height:150px;background:linear-gradient(150deg,#174a37,#0B2A1F);position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:14px 16px;color:#e2f6ec}
.cover2::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:20px 20px;pointer-events:none}
.cover2 .gl{font:700 34px var(--font);color:#7fdcae;position:relative;z-index:1;line-height:1.2;white-space:nowrap}
.cover2 .kind{position:relative;z-index:1;font-size:12px;background:rgba(255,255,255,.12);padding:2px 10px;border-radius:999px}
.bk-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.bk-b small{color:var(--muted);font-size:12.5px;font-weight:600}
.bk-b h2{font-size:18px}
.bk-b p{color:var(--muted);font-size:14px}
.bk-f{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:8px;font-size:13px;color:var(--muted)}
.bk-f .uprog{flex:1}
.bk-f b{font-family:var(--mono);color:var(--fg)}
.soon{border-style:dashed;background:transparent;align-items:center;justify-content:center;text-align:center;min-height:250px;padding:20px;color:var(--muted)}
</style>
</head>
<body>
<div class="topbar"><div class="in"><a class="brand" href="./"><span>المكتبة الرقمية للتقنية الكهربائية</span></a>
<div class="top-actions"><button class="iconbtn" id="themeBtn" aria-label="تبديل الوضع الليلي" title="الوضع الليلي"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg></button></div></div></div>
<main id="view">
 <header class="lib-head"><div class="eyebrow" id="college"></div><h1 id="dept"></h1><p>كتب المقررات كاملة بشرح مطابق للمذكرات وأرقام صفحاتها، ومحاكاة حية لكل درس. اختر المقرر لفتح كتابه.</p></header>
 <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="ابحث عن مقرر…" aria-label="ابحث عن مقرر"></div>
 <div class="shelf" id="shelf"></div>
 <p class="src">التقدّم في كل مقرر محفوظ على جهازك فقط.</p>
</main>
<script src="library.js"></script>
<script>
(function(){const L=window.LIBRARY;document.getElementById('dept').textContent=L.dept;document.getElementById('college').textContent=L.college+' · قسم التقنية الكهربائية';
 const get=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}};
 const shelf=document.getElementById('shelf');
 const draw=q=>{shelf.innerHTML=L.courses.filter(c=>!q||(c.title+c.code+c.blurb).includes(q)).map(c=>{const d=Object.keys(get(c.key+'-done')).length;const p=c.lessons?Math.round(d/c.lessons*100):0;
  if(c.soon)return `<div class="book" aria-disabled="true" style="opacity:.75"><div class="cover2"><span class="gl">${c.glyph}</span><span class="kind">قيد الإعداد</span></div><div class="bk-b"><small>${c.code}</small><h2>${c.title}</h2><p>${c.blurb}</p><div class="bk-f"><span>${c.units} وحدات · يُضاف قريباً</span></div></div></div>`;
  return `<a class="book" href="courses/${c.id}/"><div class="cover2"><span class="gl">${c.glyph}</span><span class="kind">${c.kind}</span></div><div class="bk-b"><small>${c.code}</small><h2>${c.title}</h2><p>${c.blurb}</p><div class="bk-f"><span>${c.units} وحدات · ${c.lessons} درساً</span><span class="uprog"><i style="width:${p}%"></i></span><b>${p}%</b></div></div></a>`}).join('')+(q?'':`<div class="book soon"><b>مقررات أخرى قريباً</b><span>تُضاف كتب القسم تباعاً.</span></div>`)};
 draw('');document.getElementById('q').addEventListener('input',e=>draw(e.target.value.trim()));
})();
</script>
<script src="shared/shell.js"></script>
</body>
</html>
